name: Build and Release EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Read Version from src/version.py
        id: version
        shell: pwsh
        run: |
          $content = Get-Content -Path src/version.py -Raw
          if ($content -notmatch "__version__\s*=\s*['""]([\w\.-]+)['""]") {
            Write-Error "Could not find __version__ in src/version.py"
            exit 1
          }
          $version = $matches[1].Trim()
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Skip if tag already released
        id: tagcheck
        shell: pwsh
        run: |
          git fetch --tags --force
          $tag = "${{ steps.version.outputs.version }}"
          if (git tag --list $tag) {
            Write-Host "Tag $tag already exists; nothing to release."
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build EXE with PyInstaller
        if: steps.tagcheck.outputs.exists == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          pyinstaller --noconfirm --noconsole --onefile --name="PoeditCopilot-$version" --icon="PoeditCopilot.png" --add-data "PoeditCopilot.png;." --add-data "LICENSE;." src/main.py
          Copy-Item "dist/PoeditCopilot-$version.exe" "dist/PoeditCopilot.exe" -Force

      - name: Generate checksums
        if: steps.tagcheck.outputs.exists == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $hash = (Get-FileHash -Algorithm SHA256 -Path "dist/PoeditCopilot-$version.exe").Hash.ToLower()
          "$hash  PoeditCopilot-$version.exe" | Out-File -Encoding ascii "dist/PoeditCopilot-$version.exe.sha256"
          "$hash  PoeditCopilot.exe" | Out-File -Encoding ascii "dist/PoeditCopilot.exe.sha256"

      - name: Create Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Version ${{ steps.version.outputs.version }}
          files: |
            dist/PoeditCopilot-${{ steps.version.outputs.version }}.exe
            dist/PoeditCopilot-${{ steps.version.outputs.version }}.exe.sha256
            dist/PoeditCopilot.exe
            dist/PoeditCopilot.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
